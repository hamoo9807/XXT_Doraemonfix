name: Release CI

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 说明: 当前 debug/release 两个 variant 均使用 debug 签名(便于覆盖安装),
      # 如需正式签名, 在 app/build.gradle 配置 signingConfigs 并在此处注入密钥
      - name: Build release binary with Gradle
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload to GitHub release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # 产物目录带版本号(build/app_v<版本>/), 用通配符匹配
          artifacts: "build/app_v*/outputs/apk/release/*.apk"
